name: flow-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: flow_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flow_dev
      POSTGRES_USER: ${POSTGRES_USER:-flow_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env da raiz}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
